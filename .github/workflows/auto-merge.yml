name: Enable PR Auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  enable-auto-merge:
    # Auto-merge is only a queue behind a remotely enforced gate.  The read-only
    # verifier deliberately fails closed when the repository administrator has
    # not yet installed the required ruleset for the PR target branch.
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.pull_request.base.ref == 'main' ||
       github.event.pull_request.base.ref == 'qa/current') &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge-ok')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify target branch required checks are enforced
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: python tools/verify_public_repository.py --repository "$REPOSITORY" --branch "$PR_BASE"

      - name: Queue merge after required checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --merge
