name: Aris QA EXE

on:
  push:
    branches:
      - qa/current
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aris-qa-exe
  cancel-in-progress: true

jobs:
  build-qa-exe:
    runs-on: windows-latest
    env:
      STABLE_UPDATE_PACKAGE_KEY_ID: ${{ vars.STABLE_UPDATE_PACKAGE_KEY_ID }}
      UPDATE_PUBLIC_KEY_B64: ${{ vars.UPDATE_PUBLIC_KEY_B64 }}
    steps:
      - name: Check out QA integration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: qa/current

      - name: Materialize qa/current as the active branch
        shell: powershell
        run: git checkout -B qa/current origin/qa/current

      - name: Set up Python for signature generation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Materialize provisioned Bootstrap public key
        shell: powershell
        run: |
          if (-not $env:STABLE_UPDATE_PACKAGE_KEY_ID -or -not $env:UPDATE_PUBLIC_KEY_B64) {
            throw "Required runtime-pair repository variables are missing"
          }
          $bytes = [Convert]::FromBase64String($env:UPDATE_PUBLIC_KEY_B64)
          if ($bytes.Length -ne 32) { throw "Bootstrap public key must decode to 32 bytes" }
          $hex = ([BitConverter]::ToString($bytes)).Replace('-', '').ToLowerInvariant()
          "ARIS_BOOTSTRAP_PACKAGE_KEY_ID=$env:STABLE_UPDATE_PACKAGE_KEY_ID" >> $env:GITHUB_ENV
          "ARIS_BOOTSTRAP_PACKAGE_PUBLIC_KEY_HEX=$hex" >> $env:GITHUB_ENV

      - name: Build QA EXE snapshot
        shell: powershell
        run: .\scripts\package_qa_exe.ps1 -FeedbackMode disabled -QaNotePath docs/manual/QA_CHECKLIST.md

      - name: Upload QA EXE artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aris-qa-exe-${{ github.sha }}
          path: dist_qa/Airs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload QA note artifact
        uses: actions/upload-artifact@v4
        with:
          name: aris-qa-note-${{ github.sha }}
          path: dist_qa/QA说明.md
          if-no-files-found: error
          retention-days: 14
