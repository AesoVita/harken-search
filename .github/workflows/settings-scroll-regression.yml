name: Settings Scroll Regression

on:
  push:
    branches:
      - qa/current

permissions:
  contents: read

jobs:
  settings-scroll-regression:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure regression tests
        run: cmake -S . -B build/settings-scroll-regression -G "Visual Studio 17 2022" -A x64

      - name: Build settings scroll behavior test
        run: cmake --build build/settings-scroll-regression --config Debug --target TestSettingsBodyScrollHeight

      - name: Run settings scroll regression tests
        run: ctest --test-dir build/settings-scroll-regression -C Debug -R SettingsBodyScrollHeight --no-tests=error --output-on-failure
